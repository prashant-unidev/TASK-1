<!DOCTYPE html>
<html>

<head>
  <title>Form Page</title>

  <link rel="stylesheet" href="form.css">
  <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968528.png">

</head>

<body>

  <!-- FIRST FORMS TASK -->

  <h2 class="Heads" style="text-align:center" ;>Matching</h2>
  <div class="formbox1">
    <br>

    <b style="margin-left: 220px; font-size: 25px;"> Boy Details </b>
    <br><br>
    <form class="boyform">
      <label id="fm2" for="bname">Boy Name</label><br>
      <input type="text" id="bname" placeholder="Name"><br>
      <label id="fm2" for="dob">DOB</label><br>
      <input type="date" id="dob" placeholder="dd-mm-yy"><br>
      <label id="fm2" for="tob">TOB</label><br>
      <input type="time" id="tob" placeholder="--:--"><br>
      <label id="fm2" for="plcname">Place Name</label><br>
      <input type="text" id="plcname" placeholder="Enter your birth place"><br><br>


    </form>


  </div>


  <div class="formbox2">
    <br>

    <b style="margin-left: 230px; font-size: 25px;"> Girl Details </b>
    <br><br>
    <form class="girlform">
      <label id="fm2" for="gname">Girl Name</label><br>
      <input type="text" id="bname" placeholder="Name"><br>
      <label id="fm2" for="dob">DOB</label><br>
      <input type="date" id="dob" placeholder="dd-mm-yy"><br>
      <label id="fm2" for="tob">TOB</label><br>
      <input type="time" id="tob" placeholder="--:--"><br>
      <label id="fm2" for="plcname">Place Name</label><br>
      <input type="text" id="plcname" placeholder="Enter your birth place"><br><br>


    </form>





  </div>



  <button class="bot">Submit</button>










</body>

</html>
